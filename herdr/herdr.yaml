# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: workload
displayName: herdr
description: Development sandbox with mise, herdr, hunk and an opinionated zsh setup
author: andrcuns
sourceUrl: https://github.com/andrcuns/herdr-sbx

capabilities:
  - type: com.docker.sandbox/sbx@1
  - type: com.docker.sandbox/network-policy@1
    config:
      install:
        allow: ["*"]
      runtime:
        allow: ["*"]
  - type: com.docker.sandbox/ssh-agent@1
    description: Sign git commits and tags with the user's SSH key
    config:
      unrestricted: false
      phase: runtime
      sign: [git]
      authenticate: [git@github.com, git@gitlab.com]
  - type: com.docker.sandbox/git-identity@1
    optional: true
    description: Use the runtime-provided Git author name and email
  - type: com.docker.sandbox/lifecycle@1
    config:
      startup:
        - description: Merge missing signing defaults without replacing user settings
          env: [XDG_CONFIG_HOME]
          command: |
            set -eu
            config="${XDG_CONFIG_HOME:-$HOME/.config}/git/config"
            mkdir -p "$(dirname "$config")"
            set_default() {
              if git config --file "$config" --get "$1" >/dev/null; then
                return
              else
                status=$?
                [ "$status" -eq 1 ] || return "$status"
              fi
              git config --file "$config" "$1" "$2"
            }
            set_default gpg.format ssh
            set_default gpg.ssh.defaultKeyCommand 'ssh-add -L'
            set_default commit.gpgsign true
            set_default tag.gpgsign true
      install:
        - description: "Install global npm packages"
          user: "1000"
          command: |
            npm config set allow-scripts=@ataraxy-labs/sem,diff-so-fancy --location=user
            npm install -g diff-so-fancy @ataraxy-labs/sem
