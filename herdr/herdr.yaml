# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: workload
displayName: herdr
description: Development sandbox with mise, herdr, hunk and an opinionated zsh setup.
sourceUrl: https://github.com/andrcuns/herdr-sbx

capabilities:
  - type: com.docker.sandbox/sbx@1

  - type: com.docker.sandbox/agent-skills@1
    config:
      path: /home/agent/.pi/agent/skills

  - type: com.docker.sandbox/network-policy@1
    config:
      install:
        allow: ["*"]
      runtime:
        allow: ["*"]

  - type: com.docker.sandbox/ssh-agent@1
    optional: true
    description: Use the forwarded SSH agent for Git authentication and commit signing.
    config:
      phase: runtime
      unrestricted: true

  - type: com.docker.sandbox/git-identity@1
    optional: true
    description: Use the runtime-provided Git author name and email.

  - type: com.docker.sandbox/lifecycle@1
    config:
      startup:
        - description: "Setup git for commit signing"
          user: "1000"
          command: |
            set -e
            signing_key="$(ssh-add -L 2>/dev/null)" || signing_key=""
            signing_key="${signing_key%%$'\n'*}"
            if [ -n "$signing_key" ]; then
              git config --global commit.gpgsign true
              git config --global tag.gpgsign true
              git config --global gpg.format ssh
              git config --global user.signingkey "key::${signing_key}"
              echo "Setup Git SSH signing config"
            else
              echo "No SSH public key available from ssh-add; skipping Git SSH signing config" >&2
            fi
      install:
        - description: "Install global npm packages"
          user: "1000"
          command: |
            npm config set allow-scripts=@ataraxy-labs/sem,diff-so-fancy --location=user
            npm install -g diff-so-fancy @ataraxy-labs/sem
