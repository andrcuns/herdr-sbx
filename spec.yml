schemaVersion: "2"
kind: sandbox
name: herdr
sandbox:
  image: "ghcr.io/andrcuns/herdr-sbx:latest"
  entrypoint: [herdr]
setup:
  startup:
    - description: "Setup git for commit signing"
      user: "1000"
      command: [bash, /home/agent/setup-git.sh]
  install:
    - description: "Install global mise tools"
      command: "mise install"
      user: "1000"
    - description: "Install global npm packages"
      user: "1000"
      command: |
          npm config set allow-scripts=@ataraxy-labs/sem,@earendil-works/pi-coding-agent,diff-so-fancy --location=user
          npm install -g diff-so-fancy @ataraxy-labs/sem @earendil-works/pi-coding-agent
          pi update --extensions
