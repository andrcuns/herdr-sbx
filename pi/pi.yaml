# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: pi (mixin)
description: Pi harness mixin
author: andrcuns
sourceUrl: https://github.com/andrcuns/herdr-sbx

capabilities:
  - type: com.docker.sandbox/agent-skills@1
    optional: true
    config:
      path: /home/agent/.pi/agent/skills
  - type: com.docker.sandbox/lifecycle@1
    config:
      startup:
        # Ensure .pi directory is writeable by agent user
        - command: [sh, -c, "chown -R agent:agent /home/agent/.pi 2>/dev/null || true"]
          user: "0"
          description: Re-own pi skills volume mount roots to agent
      install:
        - description: "Install pi"
          user: "1000"
          env: [NPM_CONFIG_PREFIX]
          command: npm install -g --ignore-scripts @earendil-works/pi-coding-agent
